name: Spike
description: Zeitlich begrenzte Untersuchung, die mit einer Entscheidung endet
labels: ["type:spike"]
body:
  - type: textarea
    id: frage
    attributes:
      label: Frage
      description: Was soll geklärt werden?
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Zeitrahmen
      description: z. B. 1 Abend
    validations:
      required: true
  - type: textarea
    id: ergebnis
    attributes:
      label: Erwartetes Ergebnis
      description: Entscheidung, ADR oder Notiz
