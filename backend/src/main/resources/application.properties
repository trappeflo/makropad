spring.application.name=makropad-backend

# Datenbank als Datei, damit die Sicherung einen Neustart überlebt (ADR 0005, #18).
# Die Datei liegt in data/ und ist per .gitignore ausgeschlossen.
spring.datasource.url=jdbc:h2:file:./data/makropad
spring.datasource.username=sa
spring.datasource.password=

# Das Schema entsteht aus der Entity (eine Tabelle, lokaler Betrieb).
spring.jpa.hibernate.ddl-auto=update

# Datenbankzugriffe nur in der Service-Schicht, nicht beim Rendern der Antwort
spring.jpa.open-in-view=false
