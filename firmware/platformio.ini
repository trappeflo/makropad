; Firmware des Makropads (Issue #21): Tasten einlesen und als USB-Tastatur senden.
; Das Board (ESP32-S3 Mini, ESP32-S3FH4R2) hat 4 MB Flash, nicht 8 MB wie das DevKitC-Profil.
; USB-OTG-Modus (TinyUSB), damit Tastatur (HID) und serielle Schnittstelle gleichzeitig laufen (Spike #43).
; Bauen und hochladen: python -m platformio run -t upload
; Hinweis: Neuflashen braucht den Download-Modus von Hand (BOOT halten, RESET drücken), danach RESET.

[env:makropad]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = default.csv
extra_scripts = pre:add_fs_include.py
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Debug-Ausgabe auf der seriellen Schnittstelle. Muss mit dem Protokoll-Handler (#29) entfallen,
    ; weil das Pad nach Protokoll v1 nie von sich aus sendet.
    -DMAKROPAD_DEBUG=1
