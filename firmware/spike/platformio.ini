; Hardware-Spike #43: Wegwerf-Sketche, um das Board zu prüfen. Nicht die spätere Firmware (#21).
; Zwei Umgebungen, jeweils mit eigener Quelldatei:
;   led_serial  USB-Serial/JTAG-Modus (so meldet sich das Board ab Werk): LED und serielle Schnittstelle
;   hid_cdc     USB-OTG-Modus (TinyUSB): Tastatur und serielle Schnittstelle gleichzeitig (Issue #31)
; Bauen und hochladen: python -m platformio run -e <umgebung> -t upload

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Das AYWHP-Mini-Board hat laut esptool einen ESP32-S3FH4R2: 4 MB Flash, 2 MB PSRAM (nicht 8 MB wie das DevKitC-Profil)
board_upload.flash_size = 4MB
board_build.partitions = default.csv

[env:led_serial]
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<led_serial.cpp>

[env:hid_cdc]
; Die USB-Bibliothek enthält Quellen (Massenspeicher), die FS.h brauchen. Das Skript ergänzt den Include-Pfad.
extra_scripts = pre:add_fs_include.py
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<hid_cdc.cpp>
